name: Build x64 Installer

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique job UUID generated by Cloudflare Worker'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      JOB_ID: ${{ inputs.job_id }}
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      RUNNER_AUTH_SECRET: ${{ secrets.RUNNER_AUTH_SECRET }}

    steps:
      - name: Validate input and secrets
        shell: pwsh
        run: |
          if ($env:JOB_ID -notmatch '^[a-f0-9-]{36}$') {
            throw "Invalid job_id format."
          }
          if ([string]::IsNullOrWhiteSpace($env:WORKER_BASE_URL) -or [string]::IsNullOrWhiteSpace($env:RUNNER_AUTH_SECRET)) {
            throw "Missing required repository secrets WORKER_BASE_URL or RUNNER_AUTH_SECRET."
          }

      - name: Checkout builder scripts
        uses: actions/checkout@v4

      - name: Claim job and download package from R2
        shell: pwsh
        run: |
          $base = $env:WORKER_BASE_URL.TrimEnd('/')
          $headers = @{ Authorization = "Bearer $($env:RUNNER_AUTH_SECRET)" }

          $claim = Invoke-RestMethod -Method Post -Uri "$base/api/internal/jobs/$($env:JOB_ID)/claim" -Headers $headers
          if (-not $claim.downloadUrl) {
            throw "Worker claim did not return a downloadUrl."
          }

          $workDir = Join-Path $env:RUNNER_TEMP "tukuai-$($env:JOB_ID)"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          $archivePath = Join-Path $workDir 'input.zip'
          $metaPath = Join-Path $workDir 'metadata.json'

          $claim.metadata | ConvertTo-Json -Depth 5 | Out-File -FilePath $metaPath -Encoding utf8

          # Use curl.exe without printing the temporary signed URL to public logs.
          & curl.exe -fsSL --retry 2 -o $archivePath $claim.downloadUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download input archive from temporary storage (exit $LASTEXITCODE)."
          }

          # Notify Worker immediately so the R2 temporary object is deleted right away.
          try {
            Invoke-RestMethod -Method Post -Uri "$base/api/internal/jobs/$($env:JOB_ID)/downloaded" -Headers $headers | Out-Null
          } catch {
            Write-Warning "Failed to acknowledge R2 deletion immediately: $($_.Exception.Message)"
          }

          "work_dir=$workDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "archive_path=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "meta_path=$metaPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: claim

      - name: Generate .iss and compile x64 installer
        id: compile
        shell: pwsh
        run: |
          $outDir = Join-Path "${{ steps.claim.outputs.work_dir }}" 'out'
          & "$env:GITHUB_WORKSPACE\scripts\build-installer.ps1" `
            -ArchivePath "${{ steps.claim.outputs.archive_path }}" `
            -WorkDir "${{ steps.claim.outputs.work_dir }}" `
            -OutputDir $outDir `
            -MetadataJsonPath "${{ steps.claim.outputs.meta_path }}"

      - name: Upload installer artifact (1-day retention)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ inputs.job_id }}
          path: ${{ steps.compile.outputs.exe_path }}
          retention-days: 1
          if-no-files-found: error

      - name: Notify Worker of completion
        if: always()
        shell: pwsh
        env:
          JOB_OUTCOME: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          EXE_NAME: ${{ steps.compile.outputs.exe_name }}
        run: |
          $base = $env:WORKER_BASE_URL.TrimEnd('/')
          $headers = @{
            Authorization  = "Bearer $($env:RUNNER_AUTH_SECRET)"
            'Content-Type' = 'application/json'
          }
          $ok = ($env:JOB_OUTCOME -eq 'success') -and (-not [string]::IsNullOrWhiteSpace($env:ARTIFACT_ID))
          $preferredName = if (-not [string]::IsNullOrWhiteSpace($env:EXE_NAME)) {
            [System.IO.Path]::ChangeExtension($env:EXE_NAME, '.zip')
          } else {
            'TuKuai-Setup-x64.zip'
          }

          $body = @{
            ok           = $ok
            runId        = $env:GITHUB_RUN_ID
            artifactId   = $env:ARTIFACT_ID
            artifactName = $preferredName
            errorMessage = if ($ok) { $null } else { "GitHub Actions build finished with status: $($env:JOB_OUTCOME)" }
          } | ConvertTo-Json -Compress

          Invoke-RestMethod -Method Post -Uri "$base/api/internal/jobs/$($env:JOB_ID)/complete" -Headers $headers -Body $body | Out-Null
          if (-not $ok) {
            throw "Build did not produce an available artifact."
          }
